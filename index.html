<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abdurahman Al-Duraywish | AI, Software Engineering &amp; Data</title>
    <meta
      name="description"
      content="Computer Science graduate building intelligent solutions through AI, software engineering and data. Projects, experience, awards and certifications."
    />
    <meta name="author" content="Abdurahman Al-Duraywish" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f5" />
    <meta name="color-scheme" content="dark light" />
    <!-- Apply a theme the visitor picked before, before first paint (see ThemeToggle) -->
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Social previews. VITE_SITE_URL is set in .env -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Abdurahman Al-Duraywish | AI, Software Engineering & Data" />
    <meta
      property="og:description"
      content="Computer Science graduate building intelligent solutions through AI, software engineering and data."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
